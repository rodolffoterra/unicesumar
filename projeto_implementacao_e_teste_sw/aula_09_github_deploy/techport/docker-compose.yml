services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: techport-api
    ports:
      - "8000:8000"
    env_file:
      - ./app/.env
    environment:
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: techport-streamlit
    ports:
      - "8501:8501"
    env_file:
      - ./app/.env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped